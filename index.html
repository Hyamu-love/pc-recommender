<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연속 PC 셋업 추천기 (1~8회차)</title>
<style>
 :root{--bg:#faf9f5;--card:#fff;--bd:#e5e3da;--bd2:#cfccc0;--tx:#23221e;--mut:#6b6a63;--ac:#185fa5;--acbg:#e6f1fb}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55}
 .wrap{max-width:840px;margin:0 auto;padding:20px 16px 70px}
 h1{font-size:20px;font-weight:600;margin:0 0 2px}.sub{color:var(--mut);font-size:12.5px;margin:0 0 16px}
 .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
 .tab{border:1px solid var(--bd2);background:#fff;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--tx)}
 .tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
 .tab.gap{border-style:dashed;color:var(--mut)}
 .panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:15px 17px;margin-bottom:16px}
 .lbl{font-size:13px;color:var(--mut);margin:0 0 9px}
 .lbl b{color:var(--tx)}
 .pbtns{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
 .pb{width:38px;height:38px;border:none;border-radius:8px;color:#fff;font-weight:700;font-size:16px;cursor:pointer;opacity:.92}
 .pb:hover{opacity:1}.pb:active{transform:scale(.94)}
 .seqrow{display:flex;align-items:center;gap:9px;margin-top:8px;flex-wrap:wrap}
 .seq{display:flex;gap:4px;min-height:32px;align-items:center}
 .tile{width:28px;height:28px;border-radius:6px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
 .tile.inf{outline:2px dashed var(--bd2);opacity:.5}
 .mini{font-size:12px;color:var(--mut)}
 .ctrl{margin-left:auto;display:flex;gap:7px}
 .gbtn{border:1px solid var(--bd2);background:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--tx)}
 .gbtn:hover{background:var(--bg)}
 .status{font-size:13.5px;margin:0 0 14px}.status b{color:var(--ac)}
 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
 .card{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:12px}
 .card.top{border:2px solid var(--ac)}
 .chead{display:flex;align-items:center;gap:7px;margin-bottom:5px}
 .rank{font-size:11px;color:var(--mut);font-weight:600}.nm{font-weight:600;font-size:13.5px;flex:1}
 .pct{font-weight:700;font-size:13.5px;color:var(--ac)}
 .badges{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 8px}
 .bdg{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);color:var(--mut)}
 .bdg.mir{background:#eeedfe;color:#3c3489;border-color:#cecbf6}.bdg.warn{background:#fcebeb;color:#a32d2d;border-color:#f7c1c1}
 .board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--bd);padding:3px;border-radius:5px;margin:6px 0}
 .cell{aspect-ratio:1;border-radius:2px;background:#f4f3ee}
 .meta{font-size:11px;color:var(--mut);margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
 .empty{color:var(--mut);font-size:13.5px;padding:6px 0}
 .note{background:var(--acbg);border:1px solid #b5d4f4;border-radius:9px;padding:12px 14px;font-size:13px}
 .note a{color:var(--ac);font-weight:600}
 .scroll{max-height:540px;overflow:auto;padding-right:4px}
</style></head><body><div class="wrap">

const ORDER=["T","I","L","J","S","Z","O"];
const COL={T:"#7F77DD",I:"#1D9E75",L:"#D85A30",J:"#378ADD",S:"#639922",Z:"#E24B4A",O:"#EF9F27"};
const M={T:"T",I:"I",O:"O",L:"J",J:"L",S:"Z",Z:"S",_:"_"};
const mset=s=>[...(s||"")].sort().join("");
const mfield=rows=>rows.map(r=>[...r].reverse().map(c=>M[c]||c).join(""));
const mpieces=s=>[...s].map(c=>M[c]).sort().join("");
const morder=xy=>M[xy[0]]+M[xy[1]];

/* ---------- matchers ---------- */
function c1index(){const idx={},orders=p=>[p,p[1]+p[0]],push=(o,r)=>{(idx[o]=idx[o]||[]).push(r);};
 for(const e of DB["1"]){const nat=e.cat.split("/")[0],grp=e.cat.includes("/");
  for(const o of orders(nat)){const pct=(e.percents[o]!==undefined)?e.percents[o]:e.percents["_"];if(pct===undefined)continue;
   push(o,{label:e.label,pct,note:e.note,field:e.field,mir:false,sv:e.sv});
   if(grp)push(morder(o),{label:e.label,pct,note:e.note,field:mfield(e.field),mir:true,sv:""});}}
 for(const o in idx)idx[o].sort((a,b)=>b.pct-a.pct);return idx;}
const C1=c1index();
function recC1(seq){let inf=null,last2;
 if(seq.length>=7){last2=seq[5]+seq[6];}
 else{const miss=ORDER.filter(p=>!seq.includes(p));if(miss.length!==1)return null;inf=miss[0];last2=seq[5]+inf;}
 return {last2,inf,recs:C1[last2]||[]};}

const C2G={};for(const e of DB["2"]){(C2G[e.lo]=C2G[e.lo]||[]).push(e);}
function arrSegs(a){if(!a||a.startsWith("3p"))return null;return a.split(">").filter(Boolean).map(s=>new Set(s));}
function matchArr(segs,nb){let i=0;for(const s of segs){const ch=nb.slice(i,i+s.size);if(ch.length<s.size)return false;const cs=new Set(ch);if(cs.size!==s.size||[...ch].some(c=>!s.has(c)))return false;i+=s.size;}return true;}
function recC2(lo,nb){lo=mset(lo);let mir=false,pool=C2G[lo];
 if(!pool){pool=C2G[mset(mpieces(lo))];mir=true;nb=[...nb].map(c=>M[c]).join("");}
 if(!pool)return{mir,recs:[]};const out=[];
 for(const e of pool){const segs=arrSegs(e.arrival);let ok,kind;
  if(segs===null){ok=true;kind="3p";}else{ok=matchArr(segs,nb);kind="QB";}
  if(!ok)continue;const vals=Object.values(e.saves);const best=vals.length?Math.max(...vals):0;
  out.push({arrival:e.arrival,kind,saves:e.saves,best,inferred:e.inferred,field:mir?mfield(e.field):e.field,mir,sv:mir?"":e.sv});}
 out.sort((a,b)=>b.best-a.best||(a.kind==="QB"?-1:1));return{mir,recs:out};}

function browseLo(cycle,lo){lo=mset(lo);let mir=false,list=DB[cycle].filter(e=>mset(e.lo)===lo);
 if(!list.length){const ml=mset(mpieces(lo));list=DB[cycle].filter(e=>mset(e.lo)===ml);mir=list.length>0;}
 return{mir,recs:list.map(e=>({label:e.label,field:mir?mfield(e.field):e.field,arrivals:e.arrivals,starred:e.starred,tag:e.section||e.tier||"",sv:mir?"":(e.sv||"")}))};}
function browseC4(miss){miss=mset(miss);let mir=false,list=DB["4"].filter(e=>mset(e.miss)===miss);
 if(!list.length){const mm=mset(mpieces(miss));list=DB["4"].filter(e=>mset(e.miss)===mm);mir=list.length>0;}
 return{mir,recs:list.map(e=>({field:mir?mfield(e.field):e.field,saves:e.saves,queue:e.queue,pc:e.pc,sv_lead:e.sv_lead,sv_pct:e.sv_pct,sv:mir?"":(e.sv||"")}))};}

/* ---------- rendering ---------- */
function board(field){let h='<div class="board">';for(const row of field)for(const c of row)h+=`<div class="cell" style="background:${c==="_"?"":COL[c]||"#bbb"}"></div>`;return h+'</div>';}
function card(opts){const{rank,label,pct,badges=[],field,meta,top,solver}=opts;
 let h=`<div class="card${top?' top':''}"><div class="chead">`;
 if(rank)h+=`<span class="rank">#${rank}</span>`;
 h+=`<span class="nm">${label||""}</span>`;if(pct!=null)h+=`<span class="pct">${pct}%</span>`;h+='</div>';
 if(badges.length){h+='<div class="badges">';for(const b of badges)h+=`<span class="bdg ${b.cls||''}">${b.t}</span>`;h+='</div>';}
 h+=board(field);if(meta)h+=`<div class="meta">${meta}</div>`;
 const su=solver||"https://wirelyre.github.io/tetra-tools/pc-solver.html";
 const st=solver?"🔧 이 셋업 솔버/연습":"🔧 PC 솔버로 풀기";
 h+=`<div style="margin-top:7px"><a class="gbtn" style="display:inline-block;text-decoration:none;font-size:11px;padding:4px 9px" href="${su}" target="_blank" rel="noopener">${st}</a></div>`;
 return h+'</div>';}
function saveStr(s){return Object.entries(s).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}:${v}`).join(" ");}
const PCSOLVER="https://wirelyre.github.io/tetra-tools/pc-solver.html";
function solverPanel(queue,desc){
 return `<div class="note"><b>이 상태는 검증된 큐레이션 셋업이 없습니다.</b><br>`+
  `정확한 해법은 실제 미노를 PC 솔버에 넣어 푸세요 (틀린 추천을 싣지 않기 위함):<br><br>`+
  `→ <a href="${PCSOLVER}" target="_blank">PC Solver 열기</a><br><br>`+
  `상태: ${desc}<br>연습 큐: <code>${queue}</code><br>빈 보드 · 홀드 ON · SRS(180 없음)</div>`;}

/* ---------- piece input component ---------- */
function PieceInput(host,max,onChange){let seq=[];
 const btns=document.createElement("div");btns.className="pbtns";
 ORDER.forEach(p=>{const b=document.createElement("button");b.className="pb";b.style.background=COL[p];b.textContent=p;b.dataset.p=p;
  b.onclick=()=>{if(seq.length>=max||seq.includes(p))return;seq.push(p);render();};btns.appendChild(b);});
 const row=document.createElement("div");row.className="seqrow";
 const sq=document.createElement("div");sq.className="seq";
 const hint=document.createElement("span");hint.className="mini";
 const ctrl=document.createElement("div");ctrl.className="ctrl";
 const back=document.createElement("button");back.className="gbtn";back.textContent="← 지우기";back.onclick=()=>{seq.pop();render();};
 const clr=document.createElement("button");clr.className="gbtn";clr.textContent="초기화";clr.onclick=()=>{seq=[];render();};
 ctrl.append(back,clr);row.append(sq,hint,ctrl);host.append(btns,row);
 function render(){sq.innerHTML="";seq.forEach(p=>{const t=document.createElement("div");t.className="tile";t.style.background=COL[p];t.textContent=p;sq.appendChild(t);});
  hint.textContent=`${seq.length} / ${max}`;[...btns.children].forEach(b=>b.style.visibility=seq.includes(b.dataset.p)?"hidden":"visible");onChange(seq.slice());}
 render();return{get:()=>seq.slice(),reset:()=>{seq=[];render();}};}

/* ---------- per-cycle UI ---------- */
const out=()=>document.getElementById("out");
const input=()=>document.getElementById("input");
let cur=1;
let chainNext=null;  // {lo} carried from cycle 2 save -> cycle 3
const LOCNT={1:"잔여0",2:"잔여4",3:"잔여1",4:"잔여5",5:"잔여2",6:"잔여6",7:"잔여3",8:"=1"};

function renderTabs(){const t=document.getElementById("tabs");t.innerHTML="";
 const defs=[[1,""],[2,""],[3,"부분"],[4,""],[5,""],[6,"솔버"],[7,""],[8,"=1회차"]];
 defs.forEach(([n,tag],i)=>{const b=document.createElement("button");
  b.className="tab"+(n===cur?" on":"")+((n===6)?" gap":"");
  b.innerHTML=`${n}회차<span style="opacity:.6;font-size:10px"> ${LOCNT[n]}</span>`+(tag?` (${tag})`:"");
  b.onclick=()=>{cur=n;chainNext=null;build();};t.appendChild(b);
  if(i<defs.length-1){const ar=document.createElement("span");ar.textContent="→";ar.style.cssText="align-self:center;color:var(--mut);font-size:12px";t.appendChild(ar);}});
}

function setCycle(c){
 const ip=input();ip.innerHTML="";out().innerHTML="";
 if(c===1){
  ip.innerHTML='<p class="lbl"><b>1회차</b> · 보이는 미노(현재+넥스트)를 도착 순서대로 · 홀드 활용 가능</p>';
  const h=document.createElement("div");ip.appendChild(h);
  PieceInput(h,6,seq=>{if(seq.length<6){out().innerHTML="";return;}
   const r=recC1(seq);let s=`<p class="status">마지막 2미노: <b>${r.last2[0]} → ${r.last2[1]}</b>`;
   if(r.inf)s+=` · 추론된 7번째: <b>${r.inf}</b>`;s+=` · 셋업 ${r.recs.length}개</p>`;
   if(!r.recs.length){out().innerHTML=s+'<p class="empty">해당 순서 셋업 없음</p>';return;}
   s+='<div class="cards">';r.recs.forEach((x,i)=>{const bd=[];if(i===0)bd.push({t:"추천",cls:""});if(x.mir)bd.push({t:"거울",cls:"mir"});if(x.note)bd.push({t:x.note,cls:"warn"});
    s+=card({rank:i+1,label:x.label,pct:x.pct,badges:bd,field:x.field,top:i===0,solver:x.sv});});
   out().innerHTML=s+'</div>';});
 }else if(c===2){
  ip.innerHTML='<p class="lbl"><b>2회차</b> · 잔여 4미노 + 다음 가방 도착 순서</p>';
  const w1=document.createElement("div");const l1=document.createElement("p");l1.className="mini";l1.textContent="잔여 4미노:";
  const w2=document.createElement("div");const l2=document.createElement("p");l2.className="mini";l2.style.marginTop="10px";l2.textContent="다음 가방 도착순:";
  ip.append(l1,w1,l2,w2);let lo=[],nb=[];
  const run=()=>{if(lo.length<4){out().innerHTML="";return;}const r=recC2(lo.join(""),nb.join(""));
   let s=`<p class="status">잔여 <b>${lo.join("")}</b>${r.mir?" (거울)":""} · 도착 <b>${nb.join("")||"—"}</b> · ${r.recs.length}개</p>`;
   if(!r.recs.length){out().innerHTML=s+'<p class="empty">매칭 셋업 없음 (다음 가방을 더 입력하거나 잔여 확인)</p>';return;}
   s+='<div class="cards">';r.recs.slice(0,24).forEach((x,i)=>{const bd=[{t:x.kind,cls:""}];if(x.mir)bd.push({t:"거울",cls:"mir"});if(x.inferred)bd.push({t:"세이브추론",cls:"warn"});
    const jumps=Object.keys(x.saves).filter(k=>k.length===1).map(p=>`<button class="gbtn" style="padding:3px 8px;font-size:11px;margin-top:4px" onclick="jumpTo3('${p}')">→ 3회차 extra-${p} 연결</button>`).join(" ");
    s+=card({rank:i+1,label:"세이브 "+saveStr(x.saves),badges:bd,field:x.field,meta:"도착 "+x.arrival+(jumps?'<br>'+jumps:''),top:i===0,solver:x.sv});});
   out().innerHTML=s+'</div>';};
  PieceInput(w1,4,s=>{lo=s;run();});PieceInput(w2,7,s=>{nb=s;run();});
 }else if(c===3||c===5){
  const t=c===3?"Extra 1미노 (잔여)":"쌍 2미노 (잔여)";const mx=c===3?1:2;
  if(c===3&&chainNext){const x=chainNext.lo;const r=browseLo("3",x);
    let s=`<div class="note" style="margin-bottom:12px">🔗 <b>2회차에서 이어짐</b>: 세이브 <b>${x}</b> → 3회차 <b>extra-${x}</b></div>`;
    s+=`<p class="status">잔여 <b>${x}</b> · 셋업 ${r.recs.length}개</p>`;
    if(!r.recs.length){ip.innerHTML='<p class="lbl"><b>3회차</b> (연속)</p>';out().innerHTML=s+solverPanel(`${x},*!,*p3`,"Extra "+x);}
    else{ip.innerHTML='<p class="lbl"><b>3회차</b> (연속) · 다른 extra를 보려면 아래에서 선택</p>';
     s+='<div class="scroll"><div class="cards">';r.recs.forEach(z=>{const bd=[];if(z.starred&&z.starred.length)bd.push({t:"☆"+z.starred.length,cls:""});if(z.tag)bd.push({t:z.tag,cls:""});s+=card({label:z.label,badges:bd,field:z.field,meta:z.arrivals&&z.arrivals.length?("분기 "+z.arrivals.length):"",solver:z.sv});});
     out().innerHTML=s+'</div></div>';}
    const h=document.createElement("div");ip.appendChild(h);
    PieceInput(h,1,seq=>{if(seq.length){chainNext={lo:seq[0]};cur=3;build();}});
    loopNav(ip,3);return;}
  ip.innerHTML=`<p class="lbl"><b>${c}회차</b> · ${t} 선택 → 해당 셋업 표시</p>`;
  const h=document.createElement("div");ip.appendChild(h);
  PieceInput(h,mx,seq=>{if(seq.length<mx){out().innerHTML="";return;}const r=browseLo(""+c,seq.join(""));
   let s=`<p class="status">잔여 <b>${seq.join("")}</b>${r.mir?" (거울)":""} · 셋업 ${r.recs.length}개</p>`;
   if(!r.recs.length){
     const q=(c===3)?`${seq[0]},*!,*p3`:`[${seq.join("")}]!,*!,*p2`;
     out().innerHTML=s+solverPanel(q, (c===3?"Extra ":"쌍 ")+seq.join(""));return;}
   s+='<div class="scroll"><div class="cards">';r.recs.forEach((x,i)=>{const bd=[];if(x.starred&&x.starred.length)bd.push({t:"☆"+x.starred.length,cls:""});if(x.tag)bd.push({t:x.tag,cls:""});
    s+=card({label:x.label,badges:bd,field:x.field,meta:x.arrivals&&x.arrivals.length?("분기 "+x.arrivals.length+"개"):"",solver:x.sv});});
   out().innerHTML=s+'</div></div>';});
 }else if(c===4){
  ip.innerHTML='<p class="lbl"><b>4회차</b> · 잔여에서 <b>없는 쌍</b> 2미노를 선택 (No XY)</p>';
  const h=document.createElement("div");ip.appendChild(h);
  PieceInput(h,2,seq=>{if(seq.length<2){out().innerHTML="";return;}const r=browseC4(seq.join(""));
   let s=`<p class="status">No <b>${seq.join("")}</b>${r.mir?" (거울)":""} · 4p 셋업 ${r.recs.length}개 · 세이브는 소스 미표기</p>`;
   if(!r.recs.length){out().innerHTML=s+'<div class="note">이 쌍 조합은 데이터가 없습니다.</div>';return;}
   r.recs.sort((a,b)=>(b.pc??-1)-(a.pc??-1));
   s+='<div class="scroll"><div class="cards">';r.recs.forEach(x=>{const bd=[];
    if(x.sv_lead&&x.sv_pct!=null)bd.push({t:`${x.sv_lead}세이브 ${x.sv_pct}%`,cls:""});
    s+=card({label:"4p 셋업",pct:(x.pc!=null?x.pc:null),badges:bd,field:x.field,meta:"큐 "+x.queue,solver:x.sv});});
   out().innerHTML=s+'</div></div>';});
 }else if(c===7){
  ip.innerHTML='<p class="lbl"><b>7회차</b> · QB 4p 셋업 (잔여 3미노 상태). 전체 보기</p>';
  let s=`<p class="status">QB 4p 셋업 ${DB["7"].length}개</p><div class="scroll"><div class="cards">`;
  DB["7"].forEach(e=>{s+=card({label:"4p",field:e.field,meta:"큐 "+(e.queue||""),solver:e.sv});});
  out().innerHTML=s+'</div></div>';
 }else if(c===6){
  ip.innerHTML='<p class="lbl"><b>6회차</b> (No-X, 잔여 6미노) · 없는 미노 X를 선택</p>';
  const h=document.createElement("div");ip.appendChild(h);
  PieceInput(h,1,seq=>{if(!seq.length){out().innerHTML="";return;}
   const x=seq[0], lo=ORDER.filter(p=>p!==x).join("");
   out().innerHTML=solverPanel(`[${lo}]!,*p5`, `No-${x} (잔여 ${lo})`);});
 }else if(c===8){
  ip.innerHTML='<p class="lbl"><b>8회차</b></p>';
  out().innerHTML='<div class="note">주기성에 의해 <b>8회차 = 1회차</b>입니다 (7번 PC 후 가방 위상이 복귀). '+
   '9회차=2회차, 10회차=3회차… 이런 식으로 1~7회차가 무한 반복돼요.<br><br>'+
   '→ <b>1회차 탭</b>을 그대로 사용하세요.</div>';
 }
 loopNav(ip,c);
}
function loopNav(ip,c){const prev=c<=1?7:(c===8?7:c-1),next=c>=7?1:c+1;
 const nav=document.createElement("div");
 nav.style.cssText="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:10px";
 nav.innerHTML=`<span style="font-size:12px;color:var(--mut)">🔄 연속 흐름</span>`+
  `<button class="gbtn" onclick="cur=${prev};chainNext=null;build();">◀ ${prev}회차</button>`+
  `<button class="gbtn" style="background:var(--ac);color:#fff;border-color:var(--ac)" onclick="cur=${next};chainNext=null;build();">다음 ${next}회차 ▶</button>`+
  `<button class="gbtn" onclick="cur=1;chainNext=null;build();" style="margin-left:auto">⟲ 처음</button>`;
 ip.appendChild(nav);}
window.jumpTo3=function(p){chainNext={lo:p};cur=3;build();};
build();
</script></body></html>
